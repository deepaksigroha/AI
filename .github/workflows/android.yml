name: Build ImageClean Pro

on:
  push:
    branches: [ main, imageclean-pro ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Prepare release signing key
        env:
          KEYSTORE_B64: ${{ secrets.ICP_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ICP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ICP_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ICP_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ICP_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ICP_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ICP_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets configured – signing the release APK with a temporary key."
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.jks" -alias imageclean -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass temporary -keypass temporary -dname "CN=Deepak Sigroha, O=ImageClean Pro, C=IN"
            echo "ICP_KEYSTORE_PASSWORD=temporary" >> "$GITHUB_ENV"
            echo "ICP_KEY_ALIAS=imageclean" >> "$GITHUB_ENV"
            echo "ICP_KEY_PASSWORD=temporary" >> "$GITHUB_ENV"
          fi
          echo "ICP_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build debug & signed release APKs (+ test APK)
        run: ./gradlew --no-daemon assembleDebug assembleRelease assembleDebugAndroidTest

      - name: Verify release signature
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ImageCleanPro-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/ImageCleanPro-release.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk dist/ImageCleanPro-androidTest.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ImageCleanPro-apks
          path: dist/*.apk

      - name: Publish GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ImageCleanPro-release.apk
            dist/ImageCleanPro-debug.apk

  device-tests:
    # Installs the APK on an Android emulator and runs the instrumentation tests.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumentation tests on emulator (API 30)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew --no-daemon connectedDebugAndroidTest
